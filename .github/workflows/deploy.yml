name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [main]
  # …and allow manual runs from the Actions tab
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish rather than cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # adapter-static writes the site to ./build
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # After a successful deploy, kick the learnlangx.github.io mirror so the
  # work-accessible URL updates immediately instead of waiting for its cron.
  # Needs a fine-grained PAT with "Actions: read and write" on
  # learnlangx/learnlangx.github.io, stored as the MIRROR_DISPATCH_TOKEN secret.
  # If the secret is absent, this step no-ops (the mirror still catches up on schedule).
  trigger-mirror:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger learnlangx.github.io rebuild
        env:
          GH_TOKEN: ${{ secrets.MIRROR_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MIRROR_DISPATCH_TOKEN not set — skipping mirror trigger (it will catch up on its schedule)."
            exit 0
          fi
          gh workflow run deploy.yml --repo learnlangx/learnlangx.github.io --ref main
          echo "Triggered learnlangx.github.io rebuild."
